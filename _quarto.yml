# =============================================================================
# Lab SOP System -- Quarto Project Configuration
# =============================================================================
# This file controls rendering for ALL SOPs in the project.
# Individual .qmd files need minimal YAML -- just title, SOP number, and author.
#
# Usage:
#   quarto render              # build entire site + all PDFs
#   quarto render sops/SOP-001-autoclave.qmd   # build one SOP
#   quarto preview             # live preview of HTML site
# =============================================================================

project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - lab_sops/*.qmd
    - field_sops/*.qmd
    - sops/*.qmd

website:
  title: "Biogeochemistry Lab Resource Page"
  site-url: https://marclos.github.io/SOPs/
  repo-url: https://github.com/marclos/SOPs
  repo-actions: [edit, issue]

  navbar:
    title: "Biogeochemistry Lab"
    logo: images/biogeochemistry_logo2.png
    background: "#0057B8"
    foreground: white
    left:
      - text: "SOPs"
        href: index.qmd
    right:
      - icon: github
        href: https://github.com/marclos/SOPs

  sidebar:
    style: floating
    search: true
    contents:
      - text: "SOP Index"
        href: index.qmd
      - text: "<span class='sidebar-violet'>**New to the Lab? Start Here**</span>"
        href: sops/orientation.qmd
      - text: "<span class='sidebar-green'>**Statistics and R**</span>"
        href: https://marclos.github.io/RTricks/
      - text: "---"
      - section: "Commonly Used Field SOPs"
        contents:
          - field_sops/SOP-F001-field-safety.qmd
          - field_sops/SOP-F400-soil-sampling.qmd
      - section: "Commonly Used Lab SOPs"
        contents:
          - lab_sops/SOP-L002-laboratory-safety.qmd
          - lab_sops/SOP-L801-rstudio-github.qmd
          - lab_sops/SOP-L400-soil-moisture.qmd
format:
  html:
    format-links: [pdf]
    theme:
      light: [flatly, custom.scss]
      dark: [darkly, custom.scss]
    toc: true
    toc-depth: 3
    number-sections: false
    code-fold: true
    anchor-sections: true
    smooth-scroll: true
    embed-resources: false

# The two changes are:
#   1. template-partials: adds before-body.tex (Pandoc template, reads YAML)
#   2. include-in-header: unchanged (raw LaTeX, no Pandoc variables)
# ===========================================================================
 
  pdf:
    documentclass: article
    papersize: letter
    geometry:
      - top=1in
      - bottom=1in
      - left=1in
      - right=1in
    fontsize: 11pt
    toc: true
    number-sections: false
    colorlinks: true
    linkcolor: eablue
    urlcolor: eablue
    citecolor: eablue
    include-in-header:
      - _templates/sop-header.tex
    template-partials:
      - _templates/before-body.tex

execute:
  echo: false
  warning: false
  message: false
  freeze: auto

bibliography: references.bib
csl: apa.csl