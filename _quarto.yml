# =============================================================================
# Lab SOP System -- Quarto Project Configuration
# =============================================================================
# This file controls rendering for ALL SOPs in the project.
# Individual .qmd files need minimal YAML -- just title, SOP number, and author.
#
# Usage:
#   quarto render              # build entire site + all PDFs
#   quarto render sops/SOP-001-autoclave.qmd   # build one SOP
#   quarto preview             # live preview of HTML site
# =============================================================================

project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - lab_sops/*.qmd
    - field_sops/*.qmd
    - sops/*.qmd

website:
  title: "Biogeochemistry Lab Resource Page"
  site-url: https://marclos.github.io/SOPs/
  repo-url: https://github.com/marclos/SOPs
  repo-actions: [edit, issue]

  navbar:
    title: "Biogeochemistry Lab"
    logo: images/biogeochemistry_logo2.png
    background: "#0057B8"
    foreground: white
    left:
      - text: "SOPs"
        href: index.qmd
    right:
      - icon: github
        href: https://github.com/marclos/SOPs

  sidebar:
    style: floating
    search: true
    contents:
      - text: "SOP Index"
        href: index.qmd
      - text: "**New to the Lab? Start Here**"
        href: sops/orientation.qmd
      - text: "**Statistics and R**"
        href: https://marclos.github.io/RTricks/
      - text: "---"
      - section: "Recently Updated Field SOPs"
        contents:
          - field_sops/SOP-F01-field-safety.qmd
          - field_sops/SOP-F21-surface-water-sampling.qmd
          - field_sops/SOP-F40-soil-sampling.qmd
      - section: "Recently Updated Lab SOPs"
        contents:
          - lab_sops/SOP-L01-laboratory-safety.qmd
          - lab_sops/SOP-L02-hazardous-materials-handling.qmd
          - lab_sops/SOP-L41-soil-moisture.qmd
          - lab_sops/SOP-L46-nitrate-ammonium-kcl.qmd
          - lab_sops/SOP-L50-loss-on-ignition.qmd
          - lab_sops/SOP-L52-solvita-co2-burst.qmd
          - lab_sops/SOP-L53-microbial-biomass-carbon.qmd


format:
  html:
    format-links: [pdf]
    theme:
      light: flatly
      dark: darkly
    toc: true
    toc-depth: 3
    number-sections: false
    code-fold: true
    anchor-sections: true
    smooth-scroll: true
    embed-resources: false

  pdf:
    documentclass: article
    papersize: letter
    geometry:
      - top=1in
      - bottom=1in
      - left=1in
      - right=1in
    fontsize: 11pt
    toc: true
    number-sections: true
    colorlinks: true
    linkcolor: eablue
    urlcolor: eablue
    citecolor: eablue
    include-in-header:
      - _templates/sop-header.tex

execute:
  echo: false
  warning: false
  message: false
  freeze: auto

bibliography: references.bib
csl: apa.csl