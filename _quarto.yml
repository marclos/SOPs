# =============================================================================
# Lab SOP System -- Quarto Project Configuration
# =============================================================================
# This file controls rendering for ALL SOPs in the project.
# Individual .qmd files need minimal YAML -- just title, SOP number, and author.
#
# Usage:
#   quarto render              # build entire site + all PDFs
#   quarto render sops/SOP-001-autoclave.qmd   # build one SOP
#   quarto preview             # live preview of HTML site
# =============================================================================

project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - lab_sops/*.qmd
    - field_sops/*.qmd
    - sops/*.qmd

website:
  title: "Standard Operating Procedures"
  site-url: https://marclos.github.io/SOPs/
  repo-url: https://github.com/marclos/SOPs
  repo-actions: [edit, issue]

  navbar:
    title: "SOPs"
    left:
      - text: "SOP Index"
        href: index.qmd
    right:
      - icon: github
        href: https://github.com/marclos/SOPs

  sidebar:
    style: floating
    search: true
    contents:
      - section: "Lab SOPs"
        contents:
          - lab_sops/*.qmd
      - section: "Field SOPs"
        contents:
          - field_sops/*.qmd
      - section: "General SOPs"
        contents:
          - sops/*.qmd

format:
  html:
    theme:
      light: flatly
      dark: darkly
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: true
    anchor-sections: true
    smooth-scroll: true
    embed-resources: false

  pdf:
    documentclass: article
    papersize: letter
    geometry:
      - top=1in
      - bottom=1in
      - left=1in
      - right=1in
    fontsize: 11pt
    toc: true
    number-sections: true

execute:
  echo: false
  warning: false
  message: false
  freeze: auto

bibliography: references.bib
csl: apa.csl