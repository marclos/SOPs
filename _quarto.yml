# =============================================================================
# Lab SOP System -- Quarto Project Configuration
# =============================================================================
# This file controls rendering for ALL SOPs in the project.
# Individual .qmd files need minimal YAML -- just title, SOP number, and author.
#
# Usage:
#   quarto render              # build entire site + all PDFs
#   quarto render sops/SOP-001-autoclave.qmd   # build one SOP
#   quarto preview             # live preview of HTML site
# =============================================================================

project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - lab_sops/*.qmd
    - field_sops/*.qmd
    # add other subdirectories as needed

website:
  title: "Standard Operating Procedures"
  site-url: https://marclos.github.io/SOPs/
  repo-url: https://github.com/marclos/SOPs

  navbar:
    title: "SOPs"
    left:
      - text: "SOP Index"
        href: index.qmd
    right:
      - icon: github
        href: https://github.com/marclos/SOPs

  sidebar:
    style: floating
    search: true
    contents:
      - section: "Lab SOPs"
        contents:
          - lab_sops/*.qmd
      - section: "Field SOPs"
        contents:
          - field_sops/*.qmd

  page-footer:
    left: |
      Confidential -- For internal lab use only.
      Last site build: {{< meta date >}}
    right: |
      Managed under version control.
      [View revision history](https://github.com/marclos/SOPs/commits/main)

# -----------------------------------------------------------------------------
# Shared Metadata -- inherited by every SOP
# -----------------------------------------------------------------------------
# Individual SOPs override title, sop-number, author, date as needed.
author:
  - name: "Your Name"
    affiliation: "Department, University"

date: today
date-format: "YYYY-MM-DD"
lang: en

# Custom fields available to all SOPs via {{< meta field >}} shortcodes:
lab-name: "Your Lab Name"
lab-pi: "PI Name"
revision: "1.0"

# -----------------------------------------------------------------------------
# HTML Format Options
# -----------------------------------------------------------------------------
format:
  html:
    theme:
      light: flatly
      dark: darkly
    toc: true
    toc-depth: 3
    toc-title: "In this SOP"
    number-sections: true
    code-fold: true             # collapse code blocks (useful if SOPs have R)
    anchor-sections: true       # clickable section anchors for linking
    smooth-scroll: true
    embed-resources: false      # keep assets separate for fast page loads

  # ---------------------------------------------------------------------------
  # PDF Format Options -- archival / print / audit copies
  # ---------------------------------------------------------------------------
  pdf:
    documentclass: article
    papersize: letter
    geometry:
      - top=1in
      - bottom=1in
      - left=1in
      - right=1in
    fontsize: 11pt
    mainfont: "Latin Modern Roman"    # clean, readable serif
    sansfont: "Latin Modern Sans"
    monofont: "Latin Modern Mono"
    colorlinks: true
    linkcolor: NavyBlue
    urlcolor: NavyBlue
    toc: true
    number-sections: true
    # Header and footer via LaTeX fancyhdr:
    include-in-header:
      - text: |
          \usepackage{fancyhdr}
          \usepackage{lastpage}
          \pagestyle{fancy}
          \fancyhf{}
          \fancyhead[L]{\small Lab Standard Operating Procedure}
          \fancyhead[R]{\small\leftmark}
          \fancyfoot[L]{\small Revision \therevision\ -- \thedate}
          \fancyfoot[C]{\small CONFIDENTIAL}
          \fancyfoot[R]{\small Page \thepage\ of \pageref{LastPage}}
          \renewcommand{\headrulewidth}{0.4pt}
          \renewcommand{\footrulewidth}{0.4pt}
          % Make revision and date available as commands:
          \newcommand{\therevision}{1.0}
          \newcommand{\thedate}{\today}
    # If you have a logo, uncomment and adjust:
    # include-before-body:
    #   - text: |
    #       \begin{center}
    #       \includegraphics[width=2cm]{_templates/logo.png}\\[0.5em]
    #       \end{center}

# -----------------------------------------------------------------------------
# Execution (knitr) Options
# -----------------------------------------------------------------------------
execute:
  echo: false                   # hide code by default in rendered output
  warning: false
  message: false
  freeze: auto                  # cache results -- only re-run changed docs

# -----------------------------------------------------------------------------
# Cross-reference and Citation Options
# -----------------------------------------------------------------------------
crossref:
  fig-prefix: "Figure"
  tbl-prefix: "Table"
  eq-prefix: "Equation"

bibliography: references.bib    # shared bibliography (optional)
csl: apa.csl                    # citation style (optional)