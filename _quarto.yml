# =============================================================================
# Lab SOP System -- Quarto Project Configuration
# =============================================================================
# This file controls rendering for ALL SOPs in the project.
# Individual .qmd files need minimal YAML -- just title, SOP number, and author.
#
# Usage:
#   quarto render              # build entire site + all PDFs
#   quarto render sops/SOP-001-autoclave.qmd   # build one SOP
#   quarto preview             # live preview of HTML site
# =============================================================================

project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - orientation.qmd
    - lab_sops/*.qmd
    - field_sops/*.qmd
    - sops/*.qmd

website:
  title: "Standard Operating Procedures"
  site-url: https://marclos.github.io/SOPs/
  repo-url: https://github.com/marclos/SOPs
  repo-actions: [edit, issue]

  navbar:
    title: "SOPs"
    logo: pomona.jpg
    left:
      - text: "SOP Index"
        href: index.qmd
      - text: "New to the Lab?"
        href: orientation.qmd
    right:
      - icon: github
        href: https://github.com/marclos/SOPs

  sidebar:
    style: floating
    search: true
    contents:
      - text: "SOP Index"
        href: index.qmd
      - text: "**New to the Lab? Start Here**"
        href: orientation.qmd
      - text: "---"
      - section: "Field SOPs"
        contents:
          - field_sops/SOP-F01-field-safety.qmd
          - field_sops/SOP-F20-eureka-manta2.qmd
          - field_sops/SOP-F21-surface-water-sampling.qmd
          - field_sops/SOP-F40-soil-sampling.qmd
      - section: "Lab SOPs"
        contents:
          - lab_sops/SOP-L02-hazardous-materials-handling.qmd
          - lab_sops/SOP-L40-soil-moisture.qmd
          - lab_sops/SOP-L41-nitrate-ammonium-kcl.qmd
          - lab_sops/SOP-L42-solvita-co2-burst.qmd
          - lab_sops/SOP-L43-microbial-biomass-carbon.qmd
          - lab_sops/SOP-L44-loss-on-ignition.qmd
          - lab_sops/SOP-L60-shimadzu-toc-l.qmd

format:
  html:
    format-links: [pdf]
    title-block-banner: true
    title-block-banner-color: "#0057B8"
    theme:
      light: flatly
      dark: darkly
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: true
    anchor-sections: true
    smooth-scroll: true
    embed-resources: false

  pdf:
    documentclass: article
    papersize: letter
    geometry:
      - top=1in
      - bottom=1in
      - left=1in
      - right=1in
    fontsize: 11pt
    toc: true
    number-sections: true
    colorlinks: true
    linkcolor: "0057B8"
    urlcolor: "0057B8"
    citecolor: "0057B8"
    include-in-header:
      - _templates/sop-header.tex

execute:
  echo: false
  warning: false
  message: false
  freeze: auto

bibliography: references.bib
csl: apa.csl