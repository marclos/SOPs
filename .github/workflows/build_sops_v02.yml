# =============================================================================
# Build and Deploy Lab SOPs
# =============================================================================
# Triggers on push to master (or manual dispatch). Renders all SOPs to HTML
# and PDF, then deploys the HTML site to GitHub Pages.
#
# Setup (one-time):
#   1. In your repo: Settings > Pages > Source > GitHub Actions
#   2. That's it. No tokens or secrets needed.
#
# Optimizations:
#   - Cached TinyTeX + LaTeX packages (skips install on cache hit)
#   - Cached R packages via pak
#   - Cached Quarto setup
#   - Trimmed system dependencies
#   - Actions pinned to latest stable releases (checkout v6, deploy-pages v4)
# =============================================================================
name: Build and Deploy SOPs

on:
  push:
    branches: [master]
    paths:
      - 'lab_sops/**'
      - 'field_sops/**'
      - 'sops/**'
      - '_quarto.yml'
      - '_templates/**'
      - 'index.qmd'
      - '.github/workflows/build-deploy-sops.yml'
  workflow_dispatch:

concurrency:
  group: "sop-build"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      R_LIBS_USER: ${{ github.workspace }}/R/library

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}

      # ── TinyTeX (cached) ──────────────────────────────────────────────
      - name: Cache TinyTeX
        id: cache-tinytex
        uses: actions/cache@v5
        with:
          path: |
            ~/bin/TinyTeX
            ~/.TinyTeX
          key: tinytex-${{ runner.os }}-${{ hashFiles('.github/workflows/build-deploy-sops.yml') }}

      - name: Install TinyTeX
        if: steps.cache-tinytex.outputs.cache-hit != 'true'
        uses: r-lib/actions/setup-tinytex@v2

      - name: Ensure TinyTeX is on PATH
        if: steps.cache-tinytex.outputs.cache-hit == 'true'
        run: |
          echo "$HOME/bin" >> "$GITHUB_PATH"
          echo "$HOME/.TinyTeX/bin/x86_64-linux" >> "$GITHUB_PATH"

      - name: Install LaTeX packages
        if: steps.cache-tinytex.outputs.cache-hit != 'true'
        run: |
          tlmgr install \
            fancyhdr lastpage geometry xcolor hyperref \
            booktabs longtable caption float lm etoolbox \
            pdflscape multirow wrapfig colortbl tabu \
            threeparttable threeparttablex makecell \
            environ trimspaces \
            || true

      # ── R (pinned version) ───────────────────────────────────────────
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'

      # ── R packages (cached) ──────────────────────────────────────────
      - name: Cache R packages
        id: cache-r-packages
        uses: actions/cache@v5
        with:
          path: ${{ env.R_LIBS_USER }}
          # NOTE: cache key hashes this workflow file; any edit to the
          # workflow (even comments) will bust the R package cache.
          # Consider keying on a dedicated packages.txt if that becomes
          # a nuisance.
          key: r-packages-${{ runner.os }}-4.4.1-${{ hashFiles('.github/workflows/build-deploy-sops.yml') }}
          restore-keys: |
            r-packages-${{ runner.os }}-4.4.1-

      # System libs are needed at runtime too (not just compile time),
      # so install unconditionally in case the runner image changes.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        if: steps.cache-r-packages.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$R_LIBS_USER"
          Rscript -e 'install.packages("pak", repos = "https://cloud.r-project.org", lib = Sys.getenv("R_LIBS_USER"))'
          Rscript -e 'pak::pkg_install(c("knitr", "rmarkdown"), lib = Sys.getenv("R_LIBS_USER"))'

      # ── Quarto ────────────────────────────────────────────────────────
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # ── Render + collect ──────────────────────────────────────────────
      - name: Render site
        run: quarto render

      - name: Collect PDFs
        run: |
          mkdir -p docs/pdfs
          find docs -name "*.pdf" -exec cp {} docs/pdfs/ \;

      # ── Upload for Pages ──────────────────────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

- name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5