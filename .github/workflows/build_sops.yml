# =============================================================================
# Build and Deploy Lab SOPs
# =============================================================================
# Triggers on push to master (or manual dispatch). Renders all SOPs to HTML
# and PDF, then deploys the HTML site to GitHub Pages.
#
# Setup (one-time):
#   1. In your repo: Settings > Pages > Source > GitHub Actions
#   2. That's it. No tokens or secrets needed.
# =============================================================================

name: Build and Deploy SOPs

on:
  push:
    branches: [master]
    paths:
      - 'lab_sops/**'
      - 'field_sops/**'
      - 'sops/**'
      - '_quarto.yml'
      - '_templates/**'
      - 'index.qmd'
  workflow_dispatch:

concurrency:
  group: "sop-build"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----- System dependencies for PDF (LaTeX) -----
      - name: Install TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Install LaTeX packages
        run: |
          tlmgr install \
            fancyhdr \
            lastpage \
            geometry \
            xcolor \
            hyperref \
            booktabs \
            longtable \
            caption \
            float \
            lm \
            etoolbox \
            pdflscape \
            multirow \
            wrapfig \
            colortbl \
            tabu \
            threeparttable \
            threeparttablex \
            makecell \
            environ \
            trimspaces \
            || true

      # ----- R -----
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("knitr", "rmarkdown"), repos = "https://cloud.r-project.org")'

      # ----- Quarto -----
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # ----- Build -----
      - name: Render site
        run: quarto render

      # ----- Collect PDFs into a download folder -----
      - name: Collect PDFs
        run: |
          mkdir -p docs/pdfs
          find docs -name "*.pdf" -exec cp {} docs/pdfs/ \;
          echo "## PDF Downloads" > docs/pdfs/index.md
          echo "" >> docs/pdfs/index.md
          for f in docs/pdfs/*.pdf; do
            basename=$(basename "$f")
            echo "- [$basename]($basename)" >> docs/pdfs/index.md
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4